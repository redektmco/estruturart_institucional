    <script>
      // Guarda gclid e UTMs da URL por 90 dias (localStorage) e preenche inputs com esses nomes.
      (function () {
        var keys = ['gclid','utm_source','utm_medium','utm_campaign','utm_term'];
        var p = new URLSearchParams(location.search);
        keys.forEach(function (k) {
          var v = p.get(k);
          if (v) { try { localStorage.setItem(k, JSON.stringify({v: v, t: Date.now()})); } catch (e) {} }
        });
        window.getTracking = function () {
          var out = {};
          keys.forEach(function (k) {
            try {
              var s = JSON.parse(localStorage.getItem(k));
              if (s && Date.now() - s.t < 90 * 864e5) out[k] = s.v;
            } catch (e) {}
          });
          return out;
        };
        document.addEventListener('DOMContentLoaded', function () {
          var t = window.getTracking();
          keys.forEach(function (k) {
            document.querySelectorAll('input[name="' + k + '"]').forEach(function (el) {
              if (t[k]) el.value = t[k];
            });
          });
        });
      })();
    </script>
